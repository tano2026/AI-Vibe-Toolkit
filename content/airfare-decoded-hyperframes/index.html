<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Airfare Decoded — Modular Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fdfdfb; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="airfare-modular" data-start="0"
         data-width="1920" data-height="1080" data-duration="16">

      <!-- Scene 1: HOOK — mount sub-composition -->
      <div id="hook-mount"
           data-composition-id="scene-hook"
           data-composition-src="compositions/scene-01-hook.html"
           data-start="0" data-duration="6" data-track-index="1"
           data-width="1920" data-height="1080"></div>

      <!-- Scene 2: CONCEPT — mount sub-composition -->
      <div id="concept-mount"
           data-composition-id="scene-concept"
           data-composition-src="compositions/scene-02-concept.html"
           data-start="6" data-duration="10" data-track-index="1"
           data-width="1920" data-height="1080"></div>

    </div>

    <script>
      /* Host chỉ cần 1 timeline rỗng cho root — sub-comp tự quản timeline riêng của nó */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["airfare-modular"] = tl;
    </script>
  </body>
</html>
