# __DOMAIN__ -> trang tra cứu kho. Certbot sẽ thêm khối HTTPS và chuyển hướng.
server {
    listen 80;
    server_name __DOMAIN__;
    root __WEB_DIR__;
    index index.html;

    # Trang chứa danh mục nội bộ: bắt buộc mật khẩu, không cho bộ máy tìm kiếm lập chỉ mục
    auth_basic "Kho Tano Agency";
    auth_basic_user_file /etc/nginx/kho.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;

    location / { try_files $uri /index.html; }
}
